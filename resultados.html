<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Resultados — Riesgos Reputacionales Inteligo</title>
<style>
:root{--az:#0041a3;--azd:#00164f;--azc:#5785e1;--azp:#e1e9ff;--pl:#9ca5ba;--co:#b38864;--bg:#f4f6fb;--wh:#ffffff;--gm:#e8ecf5}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Calibri',system-ui,sans-serif;background:var(--bg);color:var(--azd);min-height:100vh}
.hdr{background:var(--azd);padding:0 32px;display:flex;align-items:center;justify-content:space-between;height:58px;border-bottom:3px solid var(--az)}
.hdr-l{display:flex;align-items:center;gap:10px}
.lm{width:32px;height:32px;background:var(--az);border-radius:5px;display:flex;align-items:center;justify-content:center}
.lt{color:white;font-size:14px;font-weight:700}
.ls{color:var(--pl);font-size:9px;letter-spacing:1.5px;text-transform:uppercase}
.hdr-r{display:flex;align-items:center;gap:12px}
.live{font-size:11px;color:#86efac;display:flex;align-items:center;gap:5px}
.dot{width:7px;height:7px;border-radius:50%;background:#22c55e;animation:pulse 1.5s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.refresh-btn{padding:5px 12px;border-radius:5px;font-size:11px;font-weight:700;cursor:pointer;border:1.5px solid rgba(255,255,255,.3);background:transparent;color:white;transition:all .15s}
.refresh-btn:hover{background:rgba(255,255,255,.1)}
.body{padding:28px 32px;max-width:1100px;margin:0 auto}
.aline{width:36px;height:3px;background:var(--az);border-radius:2px;margin-bottom:12px}
.ttl{font-size:20px;font-weight:700;color:var(--azd);margin-bottom:5px}
.sub{font-size:13px;color:var(--pl);margin-bottom:22px;line-height:1.5}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:22px}
.sc{background:var(--azp);border-radius:9px;padding:14px 16px}
.sv{font-size:26px;font-weight:700;color:var(--az)}
.sl{font-size:10px;color:var(--pl);font-weight:600;text-transform:uppercase;letter-spacing:.4px;margin-top:2px}
.grid{display:grid;grid-template-columns:1.4fr 1fr;gap:18px;align-items:start;margin-bottom:20px}
.card{background:var(--wh);border:1px solid var(--gm);border-radius:10px;overflow:hidden;margin-bottom:14px}
.card:last-child{margin-bottom:0}
.ch{background:var(--azd);padding:10px 16px;display:flex;align-items:center;justify-content:space-between}
.ch span{color:white;font-size:12px;font-weight:700;letter-spacing:.3px}
.badge{background:var(--az);color:white;font-size:10px;font-weight:700;padding:2px 8px;border-radius:12px}
.cb{padding:14px 16px}
.bar-row{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.brk{width:22px;height:22px;border-radius:50%;background:var(--az);color:white;font-size:9px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.bl{font-size:11px;color:var(--azd);width:200px;flex-shrink:0;line-height:1.3}
.bt{flex:1;background:var(--gm);border-radius:3px;height:20px;overflow:hidden}
.bf{height:100%;border-radius:3px;display:flex;align-items:center;padding-left:6px}
.bf span{color:white;font-size:9px;font-weight:700;white-space:nowrap}
.bsc{font-size:11px;font-weight:700;color:var(--azd);width:36px;text-align:right;flex-shrink:0}
.t6i{display:flex;align-items:flex-start;gap:10px;padding:9px 12px;border-radius:7px;border:1px solid var(--gm);margin-bottom:7px;background:var(--bg)}
.t6i.gld{background:#fef9e7;border-color:#b8860b}
.t6i.slv{background:#f8f9fa;border-color:var(--pl)}
.t6i.brz{background:#fdf6f0;border-color:var(--co)}
.t6n{font-size:12px;flex:1;line-height:1.3;color:var(--azd)}
.t6v{font-size:10px;color:var(--pl);margin-top:2px}
.t6s{font-size:11px;font-weight:700;color:var(--az);background:var(--azp);padding:2px 8px;border-radius:8px;white-space:nowrap;flex-shrink:0}
.voter-row{display:flex;align-items:center;justify-content:space-between;padding:8px 14px;border-bottom:1px solid var(--gm);font-size:12px}
.voter-row:last-child{border-bottom:none}
.vstatus{font-size:10px;font-weight:700;padding:2px 8px;border-radius:8px;background:#dcfce7;color:#166534}
.del-btn{background:transparent;border:none;color:var(--pl);cursor:pointer;font-size:14px;padding:2px 5px;border-radius:3px}
.del-btn:hover{color:#e53e3e;background:#fee2e2}
table{width:100%;border-collapse:collapse;font-size:11px}
th{background:var(--azd);color:white;padding:9px 10px;font-size:10px;font-weight:700;text-align:left;letter-spacing:.3px}
td{padding:8px 10px;border-bottom:1px solid var(--gm);color:var(--azd);vertical-align:top;line-height:1.3}
tr:last-child td{border-bottom:none}
tr:hover td{background:var(--azp)}
.pp{background:var(--az);color:white;font-size:9px;font-weight:700;padding:1px 6px;border-radius:8px;margin-right:3px;display:inline-block}
.btn{padding:9px 20px;border-radius:6px;font-size:12px;font-weight:700;cursor:pointer;border:none;transition:all .15s}
.bc{background:var(--co);color:white}.bc:hover{opacity:.88}
.bs{background:transparent;color:var(--az);border:1.5px solid var(--az)}.bs:hover{background:var(--azp)}
.bd{background:#e53e3e;color:white}.bd:hover{background:#c53030}
.export-bar{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.empty{text-align:center;padding:28px;color:var(--pl)}
.spinner{display:inline-block;width:16px;height:16px;border:2px solid var(--gm);border-top-color:var(--az);border-radius:50%;animation:spin .6s linear infinite;vertical-align:middle;margin-right:6px}
@keyframes spin{to{transform:rotate(360deg)}}
.loading{text-align:center;padding:48px;color:var(--pl);font-size:14px}
@media(max-width:800px){.grid,.stats{grid-template-columns:1fr}.body{padding:16px}.hdr{padding:0 16px}}
@media print{.hdr-r,.export-bar{display:none}}
</style>
</head>
<body>

<div class="hdr">
  <div class="hdr-l">
    <div class="lm">
      <svg viewBox="0 0 24 24" fill="none" width="20" height="20">
        <rect x="3" y="3" width="7" height="7" rx="1.5" fill="white"/>
        <rect x="14" y="3" width="7" height="7" rx="1.5" fill="white" opacity=".6"/>
        <rect x="3" y="14" width="7" height="7" rx="1.5" fill="white" opacity=".6"/>
        <rect x="14" y="14" width="7" height="7" rx="1.5" fill="white" opacity=".3"/>
      </svg>
    </div>
    <div><div class="lt">Inteligo Group</div><div class="ls">Risk Management</div></div>
  </div>
  <div class="hdr-r">
    <div class="live"><div class="dot"></div>En vivo</div>
    <button class="refresh-btn" onclick="loadAndRender()">↻ Actualizar</button>
  </div>
</div>

<div class="body">
  <div class="aline"></div>
  <div class="ttl">Panel de resultados — Facilitador</div>
  <div class="sub" id="sub-txt">Cargando resultados...</div>

  <div id="loading" class="loading"><span class="spinner"></span>Conectando con la base de datos...</div>
  <div id="results" style="display:none">
    <div class="stats" id="stats"></div>
    <div class="grid">
      <div class="card">
        <div class="ch"><span>Ranking — puntos acumulados</span></div>
        <div class="cb" id="bar-chart"></div>
      </div>
      <div>
        <div class="card">
          <div class="ch"><span>Top 6 prioritarios</span></div>
          <div class="cb" id="top6"></div>
        </div>
        <div class="card">
          <div class="ch"><span>Participantes</span><span class="badge" id="voters-cnt">0</span></div>
          <div id="voters-list"></div>
        </div>
      </div>
    </div>
    <div class="card">
      <div class="ch"><span>Detalle de votos</span></div>
      <div style="overflow-x:auto">
        <table><thead><tr><th>Participante</th><th>1° (6p)</th><th>2° (5p)</th><th>3° (4p)</th><th>4° (3p)</th><th>5° (2p)</th><th>6° (1p)</th></tr></thead>
        <tbody id="detail-body"></tbody></table>
      </div>
    </div>
    <div class="export-bar">
      <button class="btn bc" onclick="exportCSV()">Exportar CSV</button>
      <button class="btn bs" onclick="window.print()">Imprimir / PDF</button>
      <button class="btn bd" onclick="clearAll()">Reiniciar sesión</button>
    </div>
  </div>
</div>

<script>
// ══════════════════════════════════════════════
//  CONFIGURACIÓN — edita solo estas 2 líneas
// ══════════════════════════════════════════════
const JSONBIN_ID  = '69ef9c3c856a6821897bc35b';
const JSONBIN_KEY = '$2a$10$IeTMT3ndXlVHlyfypr5vNuUljpMMNRiWLR6YOF3lTrjUnyT3g8uSG';
// ══════════════════════════════════════════════

const RISKS = [
  "Problemas de ciberseguridad, filtración de información y fallas informáticas",
  "Prácticas poco éticas de líderes y colaboradores",
  "Accidentes relacionados con infraestructuras y tecnologías deficientes",
  "Difusión de información falsa, suplantación de identidad y ciberataques no resueltos",
  "Situaciones de acoso a colaboradores o clientes",
  "Incumplimiento de garantías de seguridad en productos, servicios e infraestructura",
  "Denuncias o investigaciones por prácticas empresariales cuestionadas",
  "Intervenciones políticas en beneficio del grupo",
  "Exposición de trabajadores y clientes a situaciones de violencia, robos y extorsiones",
  "Déficits de comunicación y vocería en medios y redes sociales",
  "Acciones contrarias a la equidad de género e igualdad de oportunidades",
  "Exclusión de poblaciones vulnerables, acceso a servicios y productos",
  "Procesos, atención y servicios o productos deficientes",
  "Percepción de abuso de poder o dominio económico",
  "Vulneración de derechos laborales, conflictos sindicales y modalidades de contratación",
  "Contaminación o afectación a la biodiversidad de productos y servicios",
  "Incumplimiento de disposiciones legales, contables y tributarias",
  "Ocultamiento o demora de información ante eventos relevantes",
  "Opacidad en relaciones contractuales y financieras con el Estado",
  "Publicidad y comunicación engañosa sobre productos y servicios"
];
const PTS = [6,5,4,3,2,1];
const API = `https://api.jsonbin.io/v3/b/${JSONBIN_ID}`;
let allVotes = [];

function computeScores(votes){
  const sc = RISKS.map((r,i)=>({name:r,idx:i,pts:0,voters:[],times:0}));
  votes.forEach(v=>v.picks.forEach((rIdx,si)=>{
    if(rIdx>=0 && rIdx<20){sc[rIdx].pts+=PTS[si];sc[rIdx].times++;sc[rIdx].voters.push({n:v.name,pts:PTS[si]});}
  }));
  return sc.sort((a,b)=>b.pts-a.pts);
}

async function loadAndRender(){
  document.getElementById('loading').style.display='block';
  document.getElementById('results').style.display='none';
  try {
    const res = await fetch(API+'/latest',{headers:{'X-Access-Key':JSONBIN_KEY}});
    const data = await res.json();
    allVotes = data.record?.votes || [];
    render(allVotes);
  } catch(e){
    document.getElementById('loading').innerHTML='<span style="color:#e53e3e">Error al conectar. Verifica las credenciales en el archivo.</span>';
  }
}

function render(votes){
  document.getElementById('loading').style.display='none';
  document.getElementById('results').style.display='block';

  const scored = computeScores(votes);
  const voted = scored.filter(s=>s.pts>0);
  const total = scored.reduce((a,b)=>a+b.pts,0);
  const maxPts = scored[0]?.pts||1;

  document.getElementById('sub-txt').textContent =
    `${votes.length} participante${votes.length!==1?'s':''} han votado. Puntos totales distribuidos: ${total}.`;

  document.getElementById('stats').innerHTML = `
    <div class="sc"><div class="sv">${votes.length}</div><div class="sl">Participantes</div></div>
    <div class="sc"><div class="sv">${voted.length}</div><div class="sl">Riesgos votados</div></div>
    <div class="sc"><div class="sv">${total}</div><div class="sl">Puntos totales</div></div>
    <div class="sc"><div class="sv">${maxPts}</div><div class="sl">Máx. puntos obtenidos</div></div>`;

  document.getElementById('bar-chart').innerHTML = voted.length ? voted.map((s,i)=>{
    const pct=Math.round(s.pts/maxPts*100);
    const col=i===0?'#b8860b':i===1?'#9ca5ba':i===2?'#b38864':'#0041a3';
    return `<div class="bar-row">
      <div class="brk" style="background:${col}">${i+1}</div>
      <div class="bl" title="${s.name}">${s.name.substring(0,36)}${s.name.length>36?'…':''}</div>
      <div class="bt"><div class="bf" style="width:${pct}%;background:${col}"><span>${pct>12?s.pts+'p':''}</span></div></div>
      <div class="bsc">${s.pts}p</div>
    </div>`;
  }).join('') : '<div class="empty">Sin votos aún</div>';

  document.getElementById('top6').innerHTML = scored.slice(0,6).map((s,i)=>{
    const cls=i===0?'gld':i===1?'slv':i===2?'brz':'';
    const med=i===0?'🥇':i===1?'🥈':i===2?'🥉':`${i+1}°`;
    const vv=[...new Set(s.voters.map(v=>v.n))];
    return `<div class="t6i ${cls}">
      <div style="font-size:16px;flex-shrink:0">${med}</div>
      <div style="flex:1"><div class="t6n">${s.name}</div><div class="t6v">${vv.join(', ')||'—'}</div></div>
      <div class="t6s">${s.pts}p</div>
    </div>`;
  }).join('');

  document.getElementById('voters-cnt').textContent = votes.length;
  document.getElementById('voters-list').innerHTML = votes.length ? votes.map((v,i)=>`
    <div class="voter-row">
      <strong>${v.name}</strong>
      <div style="display:flex;align-items:center;gap:8px">
        <span class="vstatus">Votó</span>
        <button class="del-btn" onclick="deleteVoter(${i})" title="Eliminar">×</button>
      </div>
    </div>`).join('') : '<div class="empty">Sin participantes</div>';

  document.getElementById('detail-body').innerHTML = votes.map(v=>{
    const cells = v.picks.map((rIdx,si)=>{
      const name = rIdx>=0&&rIdx<20 ? RISKS[rIdx] : '—';
      return `<td><span class="pp">${PTS[si]}p</span>${name.substring(0,40)}${name.length>40?'…':''}</td>`;
    }).join('');
    return `<tr><td><strong>${v.name}</strong></td>${cells}</tr>`;
  }).join('');
}

async function deleteVoter(i){
  if(!confirm(`¿Eliminar el voto de "${allVotes[i]?.name}"?`)) return;
  allVotes.splice(i,1);
  await fetch(API,{method:'PUT',headers:{'Content-Type':'application/json','X-Access-Key':JSONBIN_KEY},body:JSON.stringify({votes:allVotes})});
  render(allVotes);
}

async function clearAll(){
  if(!confirm('¿Borrar TODOS los votos? Esta acción no se puede deshacer.')) return;
  allVotes=[];
  await fetch(API,{method:'PUT',headers:{'Content-Type':'application/json','X-Access-Key':JSONBIN_KEY},body:JSON.stringify({votes:[]})});
  render([]);
}

function exportCSV(){
  const scored=computeScores(allVotes).filter(s=>s.pts>0);
  let csv='Ranking,Riesgo,Puntos,Veces mencionado,Votantes\n';
  scored.forEach((s,i)=>{
    const vv=[...new Set(s.voters.map(v=>v.n))].join(' | ');
    csv+=`${i+1},"${s.name}",${s.pts},${s.times},"${vv}"\n`;
  });
  csv+='\nDetalle por participante\nParticipante,1°,2°,3°,4°,5°,6°\n';
  allVotes.forEach(v=>{
    csv+=`"${v.name}",${v.picks.map(idx=>`"${idx>=0?RISKS[idx]:'—'}"`).join(',')}\n`;
  });
  const blob=new Blob(['\uFEFF'+csv],{type:'text/csv;charset=utf-8;'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='inteligo_riesgos_resultados.csv';
  document.body.appendChild(a);a.click();document.body.removeChild(a);
}

// Auto-refresh cada 30 segundos
loadAndRender();
setInterval(loadAndRender, 30000);
</script>
</body>
</html>
